<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sevenseals Atlas - Konva.js SPA</title>
  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #atlas-layout { display: flex; height: 100vh; }
    #atlas-tree {
      width: 220px;
      background: #222;
      color: #fff;
      padding: 12px 0;
      overflow-y: auto;
    }
    #atlas-main { flex: 1; display: flex; flex-direction: column; }
    #atlas-addressbar {
      background: #7c3aed;
      color: #fff;
      padding: 12px 28px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #5b21b6;
    }
    #atlas-breadcrumb {
      background: #f5f5f5;
      padding: 10px 24px;
      font-size: 18px;
      border-bottom: 1px solid #ddd;
    }
    #container { flex: 1; position: relative; }
    .atlas-tree-node {
      cursor: pointer;
      padding: 6px 24px;
      font-size: 16px;
    }
    .atlas-tree-node.selected {
      background: #0af;
      color: #fff;
    }
    .atlas-tree-children { margin-left: 16px; }
    .addressbar-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      border-radius: 6px;
      padding: 4px 14px;
      margin-right: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .addressbar-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .addressbar-sep {
      color: #c4b5fd;
      font-size: 20px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div id="atlas-addressbar"></div>
  <div id="atlas-layout">
    <nav id="atlas-tree"></nav>
    <div id="atlas-main">
      <div id="atlas-breadcrumb"></div>
      <div id="container"></div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
